name: checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
# Cancel superseded PR checks only. Reusable release checks must finish even
# when another main/release run starts, so non-PR runs use a unique run ID.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate metadata and conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A force-push can remove the previous head from advertised refs.
          # fetch-depth: 0 does not guarantee that commit is in this checkout.
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          python3 .github/scripts/version.py commits --base "$BASE_SHA" --head "$HEAD_SHA"
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - run: nix flake check --print-build-logs
      - name: Check Nix compilation cache boundaries
        run: python3 -m unittest discover -s tests -p test_nix_packaging.py
      - name: Exercise packaged browser sharing and private viewers
        run: nix develop --command python3 tests/browser_smoke.py
