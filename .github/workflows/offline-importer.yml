name: offline-importer
on:
  pull_request:
    paths:
      - 'tools/offline-importer/**'
      - '.github/workflows/offline-importer.yml'
  push:
    branches: [main]
    paths:
      - 'tools/offline-importer/**'
      - '.github/workflows/offline-importer.yml'
permissions:
  contents: read
concurrency:
  group: offline-importer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/offline-importer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/offline-importer -> target
            tools/offline-importer/validation/native-reader -> target
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path validation/native-reader/Cargo.toml
      - name: Reopen fixture output using unchanged native reader
        run: |
          bundle="$RUNNER_TEMP/importer-fixture"
          cargo run --locked -- import-fake --export "$PWD/tests/synthetic-export" --output "$bundle"
          cargo run --locked -- verify --output "$bundle"
          cargo run --locked --manifest-path validation/native-reader/Cargo.toml -- "$bundle/memory"
