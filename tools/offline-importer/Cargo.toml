[package]
name = "pantheon-offline-importer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT AND Apache-2.0"
description = "Standalone inert synthetic-only native-memory import harness"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
